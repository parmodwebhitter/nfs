<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" fill="none">
  <!-- Team planning around a big growth board -->
  <defs>
    <linearGradient id="ar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d4ed8"/><stop offset="1" stop-color="#172f6e"/></linearGradient>
    <linearGradient id="abg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0f5ff"/><stop offset="1" stop-color="#dde8ff"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="560" height="480" rx="36" fill="url(#abg)"/>
  <circle cx="470" cy="70" r="90" fill="#fff" opacity=".6"/>
  <circle cx="60" cy="420" r="70" fill="#fff" opacity=".6"/>

  <!-- board -->
  <rect x="120" y="50" width="330" height="210" rx="18" fill="#fff" stroke="#d6e0f1" stroke-width="2"/>
  <rect x="142" y="72" width="110" height="12" rx="6" fill="#17171a"/>
  <rect x="142" y="92" width="70" height="8" rx="4" fill="#d9dfe8"/>
  <path d="M150 220 200 190 240 200 290 150 330 160 380 110 420 96" stroke="url(#ar)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M150 220 200 190 240 200 290 150 330 160 380 110 420 96V236H150z" fill="#1d4ed8" opacity=".08"/>
  <circle cx="420" cy="96" r="9" fill="#1d4ed8"/>
  <circle cx="420" cy="96" r="18" stroke="#1d4ed8" stroke-width="2" opacity=".35"/>
  <rect x="318" y="66" width="118" height="34" rx="17" fill="url(#ar)"/>
  <text x="332" y="89" font-family="Times New Roman, serif" font-size="16" font-weight="700" fill="#fff">+212% ROI</text>

  <!-- table -->
  <rect x="70" y="372" width="420" height="20" rx="10" fill="#17171a"/>
  <rect x="100" y="392" width="12" height="60" rx="4" fill="#17171a"/>
  <rect x="448" y="392" width="12" height="60" rx="4" fill="#17171a"/>
  <rect x="190" y="338" width="110" height="34" rx="6" fill="#3b3b42"/>
  <rect x="196" y="344" width="98" height="24" rx="3" fill="#e6eeff"/>
  <path d="M180 372h130" stroke="#17171a" stroke-width="4"/>
  <rect x="340" y="356" width="60" height="16" rx="4" fill="#fff"/>
  <rect x="346" y="350" width="40" height="8" rx="3" fill="#c3d4f7"/>
  <circle cx="430" cy="360" r="11" fill="#fff" stroke="#17171a" stroke-width="3"/>

  <!-- person 1: presenting at board -->
  <g>
    <circle cx="470" cy="220" r="22" fill="#8a5a44"/>
    <path d="M448 214c2-20 40-24 44 2-10-6-30-8-44-2z" fill="#17171a"/>
    <path d="M440 372v-80c0-26 14-44 30-44s30 18 30 44v80z" fill="url(#ar)"/>
    <path d="M446 280 410 214" stroke="#8a5a44" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- person 2: seated left -->
  <g>
    <circle cx="140" cy="270" r="21" fill="#f2c4a5"/>
    <path d="M118 266c0-22 42-26 44 0-6-10-30-12-44 0z" fill="#5a2d1a"/>
    <path d="M112 372v-60c0-18 12-30 28-30s28 12 28 30v60z" fill="#17171a"/>
    <path d="M160 320 196 352" stroke="#f2c4a5" stroke-width="11" stroke-linecap="round"/>
  </g>

  <!-- person 3: seated right of laptop -->
  <g>
    <circle cx="330" cy="280" r="20" fill="#c98f6b"/>
    <path d="M310 276c2-22 38-24 40 0-8-8-28-8-40 0z" fill="#2b1a12"/>
    <path d="M304 372v-54c0-16 12-28 26-28s26 12 26 28v54z" fill="#fff" stroke="#d6e0f1" stroke-width="2"/>
    <path d="M310 330 290 352" stroke="#c98f6b" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- floating chips -->
  <g>
    <rect x="22" y="120" width="118" height="54" rx="14" fill="#fff" stroke="#d6e0f1" stroke-width="2"/>
    <circle cx="48" cy="147" r="13" fill="url(#ar)"/>
    <path d="m42 147 4 4 8-9" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="68" y="138" width="56" height="8" rx="4" fill="#17171a"/>
    <rect x="68" y="152" width="38" height="6" rx="3" fill="#d9dfe8"/>
  </g>
  <g>
    <rect x="452" y="300" width="88" height="40" rx="12" fill="url(#ar)"/>
    <path d="M468 326c0-7 9-10 12-3 3-7 12-4 12 3 0 7-12 12-12 12s-12-5-12-12z" fill="#fff"/>
    <rect x="498" y="316" width="30" height="8" rx="4" fill="#fff" opacity=".8"/>
  </g>
</svg>
